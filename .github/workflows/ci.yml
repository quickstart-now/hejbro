name: ci
on:
  push:
    branches: [dev, main, phase8-ci-fetch-guard]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      # `changeset status`'s baseBranch (dev) diffing shells out to `git
      # merge-base dev HEAD` — it needs a *local* branch literally named
      # `dev`, which a pull_request checkout never creates on its own (it
      # only checks out the PR ref). Both lines below are required, and
      # each is required for a different reason: `fetch-depth: 0` on its
      # own deepens the ref actually fetched, not "fetch every branch," so
      # it doesn't create a local `dev`; the explicit fetch on its own
      # creates `dev` but a shallow PR ref might not share a common
      # ancestor with it, and `merge-base` would fail anyway. `fetch-depth:
      # 0` gives the PR ref enough history to share a merge base, and the
      # explicit fetch creates the local `dev` branch to share it with.
      # `origin` here is quickstart-now/hejbro itself: this works because
      # our PR branches live on the org repo, not a fork — a fork PR's
      # `origin` would be the fork, without a `dev` branch to fetch.
      #
      # This step existing at all is why the CI failure that led to it was
      # visible in the first place: `changeset status` has no silent-pass
      # failure mode when its baseBranch ref is missing — it hard-fails
      # with a stack trace out of `getChangedPackagesSinceRef` instead of
      # quietly comparing against nothing. A gate that can't find its own
      # reference point breaking loudly, rather than reporting a vacuous
      # "nothing to do," is the one place in this round's chain of
      # corrections where the risk this phase kept finding elsewhere
      # (a check that looks like it ran but didn't) doesn't apply.
      #
      # Guarded by `ref`, not `event_name`: on a push to `dev` itself, the
      # runner's checkout *is* `dev` already, so this fetch is both
      # refused (`fatal: refusing to fetch into branch 'refs/heads/dev'
      # checked out at ...`, exit 128) and unnecessary (the local `dev`
      # branch already exists). A push to `main` still needs it — no
      # local `dev` exists there either — so gating on `event_name ==
      # 'pull_request'` would skip it on a `main` push and break
      # `changeset status` the same way. `ref != 'refs/heads/dev'` is the
      # narrower condition that actually matches "a local `dev` branch is
      # missing": true for a PR ref and for a push to `main`, false only
      # for a push to `dev` (measured on all three — see the PR).
      # TEMP EXPERIMENT (item 2(i), phase8-ci-fetch-guard, REVERTED before
      # merge): fetch target renamed to match this branch, guard removed
      # — reproduces the dev push failure structurally without touching
      # the real dev branch (the underlying git mechanism, "refuse to
      # fetch into the currently checked-out branch," is general, not
      # dev-specific).
      - run: git fetch origin phase8-ci-fetch-guard:phase8-ci-fetch-guard
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: "${{ matrix.node-version }}", cache: pnpm }
      - run: node --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm check-types
      - run: pnpm test
      - run: pnpm build
      - run: pnpm smoke:pack-install
        if: matrix.node-version == 24
      - run: pnpm changeset status
      - run: pnpm check:first-release-version
