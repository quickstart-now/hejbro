name: ci
on:
  push:
    branches: [dev, main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      # `changeset status`'s baseBranch (dev) diffing shells out to `git
      # merge-base dev HEAD` — it needs a *local* branch literally named
      # `dev`, which a pull_request checkout never creates on its own (it
      # only checks out the PR ref). `fetch-depth: 0` alone doesn't fix
      # this: it deepens the ref actually fetched, not "fetch every
      # branch."
      - run: git fetch origin dev:dev
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: "${{ matrix.node-version }}", cache: pnpm }
      - run: node --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm check-types
      - run: pnpm test
      - run: pnpm build
      - run: pnpm smoke:pack-install
        if: matrix.node-version == 24
      - run: pnpm changeset status
      - run: pnpm check:first-release-version
