name: release-version
# `dev` is where every merged PR's changeset accumulates (AGENTS.md: PRs
# squash-merge into `dev`). This workflow's only job is to keep the
# "Version Packages" PR (branch + changelog + version bumps) in sync with
# whatever changesets are currently pending on `dev` -- it must never
# publish. Scoped to `push` on `dev` only: never `pull_request` (a fork PR
# would run this in the fork's own Actions context anyway, not ours, since
# PR branches live on quickstart-now/hejbro per AGENTS.md -- but `push` is
# the narrower, correct condition regardless of that fact) and never `main`
# (main only receives dev -> main merge-commit PRs; nothing should re-open
# a version PR there).
on:
  push:
    branches: [dev]

# Two concurrent runs racing to open/update the "Version Packages" PR branch
# could interleave pushes to it. Queue instead of overlapping; don't cancel
# a run in progress -- a run cancelled mid-push could leave that branch in a
# half-updated state that the next run then has to untangle.
concurrency:
  group: release-version-dev
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # #180: lets the `version` job's dispatch step (below) start ci.yml via
  # `gh workflow run` -- see that step's comment for why this is
  # necessary at all.
  actions: write

jobs:
  check-changesets:
    if: github.repository == 'quickstart-now/hejbro'
    runs-on: ubuntu-latest
    outputs:
      has-changesets: ${{ steps.check.outputs.has-changesets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Entry condition for the `version` job below, not a guard inside it:
      # measured directly (scratch branch, changesets removed to simulate
      # "the Version Packages PR was just merged" -- run:
      # https://github.com/quickstart-now/hejbro/actions/runs/32503887251)
      # that `changeset version` (the underlying CLI command
      # `version-packages` runs) exits 1 with "No unreleased changesets
      # found" when zero changesets are pending -- not a graceful no-op.
      # And zero pending changesets is not an edge case: it is the exact
      # state `dev` is in immediately after every "Version Packages" PR
      # merge, and after merging any docs-only or private-package-only PR
      # (AGENTS.md's changeset rule exempts both). Without this, the
      # `version` job would fail on a predictable, recurring schedule.
      # Counting `.changeset/*.md` directly (excluding the template
      # `README.md`) rather than shelling out to `changeset status` keeps
      # this job cheap: no install needed, just a checkout.
      - id: check
        run: |
          count=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l)
          if [ "$count" -gt 0 ]; then
            echo "has-changesets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-changesets=false" >> "$GITHUB_OUTPUT"
          fi

  version:
    needs: check-changesets
    # Skipped entirely, not run-and-guarded, when there is nothing to
    # version -- see check-changesets' comment above for why this is a
    # recurring state, not a rare one.
    if: >-
      github.repository == 'quickstart-now/hejbro' &&
      needs.check-changesets.outputs.has-changesets == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # changesets/action/version -- NOT the monolithic changesets/action.
      # The monolithic action does NOT call its own `select-mode`
      # sub-action (confirmed: `grep -c "select-mode" dist/index.js` on
      # this exact pinned commit returns 0) -- its mode choice is an inline
      # switch in the same file, keyed on
      # `(changesets pending?) x (was a "publish-script" input given?)`.
      # With only `version-script` supplied (as an initial, mistaken draft
      # of this file did), the "no changesets, no publish-script" case
      # fires and the action explicitly returns without publishing
      # ("Not publishing because no publish script found") -- so the
      # monolithic action would NOT silently start publishing from `dev`
      # today.
      #
      # The real difference is structural, not behavioral-today:
      # changesets/action/version's own action.yml has no publish-related
      # input at all (only script/commit-message/pr-title/pr-draft/
      # pr-base-branch/push-with-git-cli/cwd) -- there is no field to add
      # that would make it publish, because the capability doesn't exist
      # in the file you'd be editing. The monolithic action is one
      # `publish-script:` line away from publishing from `dev` on every
      # future push, and nothing in its action.yml or a workflow using it
      # warns that adding that line changes `dev`'s behavior this
      # drastically. The failure mode is unrepresentable here, rather than
      # merely unselected in the monolithic action as currently configured.
      #
      # Input name verified against this exact pinned commit's
      # version/action.yml (`script`, not `version-script` -- the
      # monolithic action's top-level input is named `version-script`, the
      # decomposed sub-action's is `script`; they differ even within the
      # same release, which is the trap this comment exists to name).
      - uses: changesets/action/version@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        id: version
        with:
          script: pnpm run version-packages
      # #180: a PR opened/updated with GITHUB_TOKEN (the step above just
      # did exactly that, for "Version Packages") never triggers a
      # workflow through its normal push/pull_request events -- GitHub's
      # own recursion guard, not a bug. `dev`'s ruleset requires
      # `verify (22)`/`verify (24)`, so without this, that PR can never
      # gain those checks and the owner can never merge it with the
      # merge button. `workflow_dispatch` is the documented exception:
      # starting ci.yml this way still creates real check runs, attached
      # to the branch's current head commit, which is what the ruleset's
      # required-status-check evaluation actually looks at.
      #
      # `if:` guards against the one case `changesets/action/version`
      # itself distinguishes via its own `pr-number` output: when every
      # pending changeset is empty, it logs "All changesets are empty;
      # not creating PR" and never pushes anything -- dispatching then
      # would target a branch this run didn't touch.
      #
      # Runs on every push to `dev` that reaches this step, so every
      # later update of the Version PR re-dispatches and the checks
      # track whatever the current head is -- see this repo's PR for
      # #180 for the measured behavior when a dispatch races a second
      # `dev` push in the same window.
      - name: Dispatch ci.yml for the Version PR's required checks
        if: steps.version.outputs.pr-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref changeset-release/dev
