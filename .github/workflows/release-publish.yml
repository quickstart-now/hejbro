name: release-publish
# `main` only receives `dev -> main` merge-commit PRs (AGENTS.md's release
# flow; never squash/rebase). This workflow's only job is to publish
# whatever `main` currently holds -- it must never version. Scoped to
# `push` on `main` only: never `pull_request` (a fork PR would run this in
# the fork's own Actions context, not ours, and would find no `NPM_TOKEN`
# there either -- but `push` is the narrower, correct condition regardless)
# and never `dev` (only a landed push to `main` is a release).
on:
  push:
    branches: [main]

# Exactly one publish at a time, full stop. Not cancel-in-progress: a
# cancelled `npm publish` mid-flight still burns the version number (npm
# never lets the same version publish twice, published or not) without a
# clean run to show what happened -- an in-flight publish must finish or
# fail on its own, and a second push queues behind it instead of racing it.
concurrency:
  group: release-publish-main
  cancel-in-progress: false

jobs:
  gate:
    # Defence in depth, not a functional requirement -- see
    # release-version.yml's identical comment.
    if: github.repository == 'quickstart-now/hejbro'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm check-types
      - run: pnpm test
      - run: pnpm build
      # #86's smoke (phase8-packaging): packs the three published packages,
      # installs the tarballs with plain `npm install`, runs
      # init/generate/verify against them.
      - run: pnpm smoke:pack-install
      # Closes the gap #86's smoke leaves open (see
      # scripts/verify-pnpm-publish-tool.mjs): the smoke proves *a*
      # pnpm-packed tarball installs cleanly, not that `changeset publish`
      # actually picks pnpm for this workspace. Asserts on
      # @changesets/cli's own tool-detection call, not a guess at it.
      - run: pnpm check:pnpm-publish-tool

  publish:
    needs: gate
    if: github.repository == 'quickstart-now/hejbro'
    runs-on: ubuntu-latest
    # Placeholder for a protected Environment gate (owner decision pending,
    # not yet made): adding `environment: release` here, plus a required
    # reviewer on that Environment in repo settings, would pause this job
    # for manual approval before it runs -- an additive change (this one
    # line) that does not require re-touching anything else below. Left
    # unset for now because that Environment doesn't exist yet.
    # environment: release
    permissions:
      contents: write # changesets/action/publish pushes git tags + GitHub releases
      # Required for npm provenance (NPM_CONFIG_PROVENANCE) -- independent of
      # the NODE_AUTH_TOKEN auth method below. Verified directly (not
      # assumed) on a real Actions runner against an isolated, disposable
      # Verdaccio service container (never the real npm registry): without
      # this permission, `npm publish --provenance` fails immediately with
      # `EUSAGE: Provenance generation in GitHub Actions requires "write"
      # access to the "id-token" permission` -- a loud, non-zero-exit
      # failure, not a silent publish without provenance. With it, npm
      # obtained a real OIDC token, signed a real provenance statement, and
      # published a real entry to Sigstore's public transparency log before
      # the (test-rig-only) registry rejected the provenance-attached
      # publish call as an unsupported API -- confirming the OIDC handshake
      # itself, which real npmjs.org's registry does support, works end to
      # end.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0 } # full history: this job pushes git tags
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
      - run: pnpm install --frozen-lockfile
      # `NPM_TOKEN` is a repository-level secret on quickstart-now/hejbro (an
      # npm automation token, added 2026-08-21) -- deliberately NOT the org
      # secret of the same name: that org secret's visibility is "private"
      # (GitHub's org-secret scoping term for "the org's private repos
      # only"), it is already relied on by the other 12 (all private) repos
      # in the org, and hejbro is the org's one public repo, so exposing
      # that shared token here would widen its blast radius to every repo
      # that already trusts it. This guard step is defence in depth, not a
      # response to a currently-missing secret: if the repo secret is ever
      # removed, renamed, or this workflow is ever copied to a repo without
      # it, this fails loudly and immediately instead of invoking npm/pnpm
      # with an empty token. Value is never printed -- only ever tested for
      # absence.
      #
      # This does NOT cover "the token is present, authenticates, but lacks
      # publish rights for the @hejbro scope" (a real open question -- no
      # one has confirmed the token's scope permissions yet, since doing so
      # needs the token value itself). That case was verified separately
      # (not guessed): against an isolated, disposable Verdaccio registry
      # (never npmjs.org), both an invalid token (401) and a validly
      # authenticated user denied publish rights on the target scope (403)
      # made `changeset publish` exit non-zero with "Some packages failed to
      # publish" -- traced to `@changesets/cli@3.0.1`'s
      # commands/publish/index.ts, which throws `ExitError(1)` whenever any
      # package's publish result is `"failed"`. The one path that could
      # silently report success despite an auth problem -- an empty publish
      # plan ("No unpublished projects to publish", exit 0) -- is reached
      # via `getPublishPlan`'s per-package `pnpm info` check, which is an
      # unauthenticated registry read and 404s for an unpublished package
      # regardless of token validity; it cannot itself be the thing masking
      # an auth failure here, because every real release publishes at least
      # one genuinely new version.
      - name: Verify NPM_TOKEN is configured
        run: |
          if [ -z "${{ secrets.NPM_TOKEN }}" ]; then
            echo "::error::NPM_TOKEN secret is not set on quickstart-now/hejbro. Next: the owner must add a repository-level NPM_TOKEN secret (an npm automation token, not a publish token -- a publish token prompts for 2FA and fails in CI; see AGENTS.md's Owner actions) before this workflow can publish."
            exit 1
          fi
      # changesets/action/publish -- NOT the monolithic changesets/action:
      # see release-version.yml's comment on why the decomposed sub-actions
      # are used instead of the mode-auto-selecting monolithic one.
      #
      # Input name verified against this exact pinned commit's
      # publish/action.yml (`script`, not `publish-script` -- same trap as
      # noted in release-version.yml, the input name differs by which
      # action you reference even within one release).
      - uses: changesets/action/publish@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          script: pnpm release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
